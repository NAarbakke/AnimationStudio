<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Razorbill Drop</title>
<link rel="stylesheet" href="/src/shared/fonts/fonts.css">
<style>
  :root {
    color-scheme: dark;
    --ink: #F4F1EA;
    --dim: #DCD6CA;
    --amber: #FFB35C;
    --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --cond: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  }
  html, body { height: 100%; margin: 0; background: #000; color: var(--ink); overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #err[hidden] { display: none; }
  #err { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 24px; text-align: center; font-family: var(--mono); color: var(--dim); }
  .title { position: fixed; left: 64px; bottom: 72px; pointer-events: none; opacity: 0; text-shadow: 0 2px 18px rgba(0,0,0,.55); }
  .title h1 { margin: 0; font-family: var(--cond); font-weight: 700; font-size: clamp(44px, 6vw, 132px); letter-spacing: .04em; line-height: 1; }
  .title .rule { width: 96px; height: 2px; margin-top: 14px; background: var(--amber); }
  .title p { margin: 12px 0 0; font-family: var(--cond); font-weight: 600; font-size: clamp(22px, 2.6vw, 56px); letter-spacing: .06em; color: var(--ink); }
  #plot { position: fixed; right: 56px; top: 50%; width: min(46vw, 860px); transform: translateY(-50%); opacity: 0; pointer-events: none; }
  #plot svg { display: block; width: 100%; height: auto; }
  #plot .panel { fill: rgba(5, 8, 14, .78); }
  #plot .grid { stroke: rgba(244, 241, 234, .13); stroke-width: 1; }
  #plot .axis { stroke: var(--dim); stroke-width: 1.5; fill: none; }
  #plot text { font-family: var(--cond); font-weight: 600; font-size: 28px; letter-spacing: .08em; fill: var(--ink); }
  #plot #trace { stroke: var(--amber); stroke-width: 3; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  #plot #head { fill: var(--amber); stroke: #05080e; stroke-width: 2; }
  #fade { position: fixed; inset: 0; background: #000; pointer-events: none; }
  /* lab switcher (as in shared/lab.css); hidden in ?film so the render stays clean */
  .labs { position: fixed; left: 20px; top: 18px; z-index: 1; display: flex; border: 1px solid rgba(244, 241, 234, .28); background: rgba(5, 8, 14, .66); }
  .labs[hidden] { display: none; }
  .labs a { font-family: var(--cond); font-weight: 600; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); text-decoration: none; padding: 5px 10px; }
  .labs a + a { border-left: 1px solid rgba(244, 241, 234, .28); }
  .labs a:hover { color: var(--ink); }
  .labs a[aria-current="page"] { background: var(--ink); color: #05080e; }
  .labs a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
</style>

<canvas id="c" aria-label="3D animation of the Razorbill farm drone dropping a sensor rod into a crop field, where larvae climbing the rod spike a signal plot"></canvas>
<div id="err" hidden>WebGL is not available in this browser, so the animation cannot render.</div>
<div class="title" id="intro">
  <h1>Operation SKYFALL</h1>
  <div class="rule"></div>
  <p>Razorbill farm drone</p>
</div>
<div id="plot" role="img" aria-label="Plot of signal against time: the signal spikes up and back down each time a larva crosses the sensor strip">
  <svg viewBox="0 0 860 520">
    <rect class="panel" width="860" height="520" rx="4"/>
    <line class="grid" x1="96" x2="824" y1="60" y2="60"/><line class="grid" x1="96" x2="824" y1="180" y2="180"/><line class="grid" x1="96" x2="824" y1="300" y2="300"/>
    <path class="axis" d="M96 36V420H824"/>
    <path id="trace"/>
    <circle id="head" r="6"/>
    <text transform="translate(58 228) rotate(-90)" text-anchor="middle">Signal</text>
    <text x="460" y="476" text-anchor="middle">Time</text>
  </svg>
</div>
<div id="fade"></div>
